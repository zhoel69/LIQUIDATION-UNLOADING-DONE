<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>DATA INPUT UNLOADING</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,sans-serif;

  -webkit-user-select:none;
  -ms-user-select:none;
  user-select:none;

  -webkit-touch-callout:none;
}

body{
  background:#0F1115;
  padding:14px;
  color:#D8FFD8;
  touch-action:manipulation;
}

.container{
  max-width:520px;
  margin:auto;
}

.card{
  background:#171A21;
  border-radius:24px;
  padding:18px;
  border:1px solid #222831;

  box-shadow:
  0 0 20px rgba(0,255,120,0.08),
  0 0 40px rgba(255,0,80,0.05);
}

.title{
  text-align:center;
  font-size:24px;
  font-weight:900;
  color:#00FF88;
  letter-spacing:1px;
}

.sub{
  text-align:center;
  margin-top:6px;
  margin-bottom:22px;
  color:#8B949E;
  font-size:11px;
  letter-spacing:2px;
}

.grid2{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.form-group{
  margin-bottom:14px;
}

label{
  display:block;
  margin-bottom:7px;
  font-size:11px;
  font-weight:bold;
  color:#9CFFA7;
  letter-spacing:1px;
}

.input-wrap{
  position:relative;
}

.input{
  width:100%;
  height:50px;
  border:none;
  border-radius:15px;
  background:#11151C;
  padding:0 14px;
  font-size:13px;
  color:#E8FFE8;
  border:1px solid #2A313C;
  text-transform:uppercase;
}

.input:focus{
  outline:none;
  border:2px solid #00FF88;
  background:#0F1319;
}

.dropdown{
  position:absolute;
  top:56px;
  left:0;
  width:100%;
  background:#1B2029;
  border-radius:15px;
  overflow:hidden;
  box-shadow:0 10px 25px rgba(0,0,0,0.4);
  display:none;
  z-index:999;
  max-height:180px;
  overflow-y:auto;
  border:1px solid #2A313C;
}

.dropdown-item{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;

  padding:12px 14px;
  cursor:pointer;
  transition:0.2s;
  text-transform:uppercase;
  color:#D8FFD8;
  font-size:13px;
}

.dropdown-item:hover{
  background:#1F2630;
}

.dropdown-text{
  flex:1;
}

.delete-btn{
  width:24px;
  height:24px;
  border:none;
  border-radius:50%;
  background:#FF3B3B;
  color:#FFF;
  font-size:12px;
  font-weight:bold;
  cursor:pointer;
  flex-shrink:0;
}

.delete-btn:hover{
  opacity:0.8;
}

select.input{
  appearance:none;
  -webkit-appearance:none;
  -moz-appearance:none;
}

.upload-box{
  border:2px dashed #2F3844;
  border-radius:16px;
  padding:16px;
  background:#11151C;
}

.preview{
  margin-top:12px;
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

.preview img{
  width:75px;
  height:75px;
  object-fit:cover;
  border-radius:12px;
  border:1px solid #2F3844;
}

.btn{
  width:100%;
  height:54px;
  border:none;
  border-radius:16px;

  background:linear-gradient(
  135deg,
  #00FF88,
  #00CC6A
  );

  color:#000;
  font-size:14px;
  font-weight:900;
  cursor:pointer;
  letter-spacing:1px;
}

.result{
  margin-top:18px;
  background:#11151C;
  border-radius:16px;
  padding:16px;
  white-space:pre-line;
  font-size:13px;
  line-height:1.45;
  text-transform:uppercase;
  border:1px solid #2A313C;
  color:#D8FFD8;
}

.footer{
  text-align:center;
  margin-top:20px;
  color:#7E8793;
  font-size:11px;
  letter-spacing:1px;
}

</style>
</head>
<body>

<div class="container">

  <div class="card">

    <div class="title">
      DATA INPUT UNLOADING
    </div>

    <div class="sub">
      FAST DATA ENTRY
    </div>

    <!-- FROM TO -->
    <div class="grid2">

      <!-- FROM -->
      <div class="form-group">

        <label>FROM</label>

        <div class="input-wrap">

          <input type="text"
                 class="input auto-save"
                 id="from"
                 data-key="fromData"
                 autocomplete="off"
                 placeholder="INPUT FROM">

          <div class="dropdown"
               id="fromDropdown"></div>

        </div>

      </div>

      <!-- TO -->
      <div class="form-group">

        <label>TO</label>

        <div class="input-wrap">

          <input type="text"
                 class="input auto-save"
                 id="to"
                 data-key="toData"
                 autocomplete="off"
                 placeholder="INPUT TO">

          <div class="dropdown"
               id="toDropdown"></div>

        </div>

      </div>

    </div>

    <!-- PHASE + JENIS -->
    <div class="grid2">

      <div class="form-group">

        <label>NO. PHASE</label>

        <input type="text"
               class="input"
               id="phase"
               autocomplete="off"
               placeholder="INPUT NO. PHASE">

      </div>

      <div class="form-group">

        <label>JENIS PHASE</label>

        <select class="input"
                id="jenis">

          <option>AWB</option>
          <option>NON AWB</option>
          <option>LIQUID</option>

        </select>

      </div>

    </div>

    <!-- DRIVER -->
    <div class="form-group">

      <label>NAMA DRIVER</label>

      <div class="input-wrap">

        <input type="text"
               class="input auto-save"
               id="driver"
               data-key="driverData"
               autocomplete="off"
               placeholder="INPUT NAMA DRIVER">

        <div class="dropdown"
             id="driverDropdown"></div>

      </div>

    </div>

    <!-- NOPOL -->
    <div class="form-group">

      <label>NOMOR POLISI</label>

      <div class="input-wrap">

        <input type="text"
               class="input auto-save"
               id="nopol"
               data-key="nopolData"
               autocomplete="off"
               placeholder="INPUT NOPOL">

        <div class="dropdown"
             id="nopolDropdown"></div>

      </div>

    </div>

    <!-- SEAL -->
    <div class="form-group">

      <label>NOMOR SEAL</label>

      <input type="text"
             class="input"
             id="seal"
             autocomplete="off"
             placeholder="INPUT NOMOR SEAL">

    </div>

    <!-- TOTAL COLKY -->
    <div class="form-group">

      <label>TOTAL COLLY</label>

      <input type="number"
             class="input"
             id="colly"
             autocomplete="off"
             placeholder="INPUT TOTAL COLLY">

    </div>

    <!-- WAKTU -->
    <div class="form-group">

      <label>WAKTU UNLOADING</label>

      <input type="datetime-local"
             class="input"
             id="waktu">

    </div>

    <!-- FOTO -->
    <div class="form-group">

      <label>UPLOAD FOTO</label>

      <div class="upload-box">

        <input type="file"
               id="foto"
               multiple
               accept="image/*">

        <div class="preview"
             id="preview"></div>

      </div>

    </div>

    <button class="btn"
        style="
        margin-bottom:12px;
        background:linear-gradient(
        135deg,
        #00C2FF,
        #007BFF
        );
        color:#FFF;
        "
        onclick="simpanSemuaData()">

  SIMPAN DATA

</button>

    <!-- BUTTON WA -->
<button class="btn"
        onclick="kirimWA()">

  KIRIM KE WHATSAPP

</button>

<!-- DONE -->
<div class="form-group"
     style="margin-top:18px;">

  <label>WAKTU DONE UNLOADING</label>

  <input type="datetime-local"
         class="input"
         id="doneWaktu">

 <!-- FOTO DONE -->
<div class="form-group">

  <label>UPLOAD FOTO DONE</label>

  <div class="upload-box">

    <input type="file"
           id="fotoDone"
           multiple
           accept="image/*">

    <div class="preview"
         id="previewDone"></div>

  </div>

</div>

 <!-- BUTTON SIMPAN DONE -->
<button class="btn"
        style="
        margin-top:12px;
        margin-bottom:12px;
        background:linear-gradient(
        135deg,
        #00E0A4,
        #00B37E
        );
        color:#000;
        "
        onclick="simpanDoneData()">

  SIMPAN DONE UNLOADING

</button>

<!-- BUTTON DONE -->
<button class="btn"
        style="
        margin-top:12px;
        background:linear-gradient(
        135deg,
        #FFB300,
        #FF8800
        );
        color:#000;
        "
        onclick="kirimDoneWA()">

  KIRIM DONE UNLOADING

</button>

<!-- BUTTON RESET -->
<button class="btn"
        style="
        margin-top:12px;
        background:linear-gradient(
        135deg,
        #FF3B3B,
        #D60000
        );
        color:#FFF;
        "
        onclick="resetForm()">

  RESET DATA

</button>

<!-- RESULT UNLOADING -->
<div class="result"
     id="hasil"></div>

<!-- RESULT DONE -->
<div class="result"
     id="hasilDone"
     style="
     margin-top:12px;
     border:1px solid #00B37E;
     box-shadow:
     0 0 12px rgba(0,255,150,0.08);
     "></div>

<!-- FOOTER -->
<div class="footer">

  © 2026 ZULFAHMI AFNULA • UNLOADING DATA INPUT SYSTEM  
  ALL RIGHTS RESERVED

</div>

  </div>

</div>

<!-- ================= SUPABASE ================= -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

/* ================= SUPABASE CONFIG ================= */

const SUPABASE_URL =
'https://wepqievfgfqsoilynrhc.supabase.co';

const SUPABASE_KEY =
'sb_publishable_AUDqRGYqJi1pA7Y_QOIa-A_bIz-_zI1';

const supabaseClient =
supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

/* ================= HILANGKAN FOCUS BUTTON ================= */

const styleButton = document.createElement('style');

styleButton.innerHTML = `
.btn{
  transition: transform 0.12s ease, opacity 0.12s ease !important;
  -webkit-tap-highlight-color: transparent !important;
  outline:none !important;
}
.btn:focus,.btn:active{
  outline:none !important;
  box-shadow:none !important;
}
.btn:active{
  transform:scale(0.94);
  opacity:0.88;
}
`;

document.head.appendChild(styleButton);

/* ================= GLOBAL SAFETY ================= */

const CACHE_MASTER = {};
const REQUEST_LOCK = {};
const MAX_LIMIT = 200;

let DATA_SUDAH_DISIMPAN = false;
let DONE_SUDAH_DISIMPAN = false;

let DATA_TERAKHIR = null;
let DONE_TERAKHIR = null;

/* ================= ELEMENT ================= */

const hasilUnloading = document.getElementById('hasil');
const hasilDone = document.getElementById('hasilDone');
const doneWaktu = document.getElementById('doneWaktu');

/* ================= FOTO UNLOADING ================= */

const foto = document.getElementById('foto');
const preview = document.getElementById('preview');
let filesDipilih = [];

foto.addEventListener('change', function(){
  filesDipilih = [...this.files];
  preview.innerHTML = '';

  filesDipilih.forEach(file=>{
    const reader = new FileReader();
    reader.onload = e=>{
      const img = document.createElement('img');
      img.src = e.target.result;
      preview.appendChild(img);
    };
    reader.readAsDataURL(file);
  });
});

/* ================= FOTO DONE (NEW) ================= */

const fotoDone = document.getElementById('fotoDone');
const previewDone = document.getElementById('previewDone');
let filesDoneDipilih = [];

if(fotoDone){
  fotoDone.addEventListener('change', function(){
    filesDoneDipilih = [...this.files];
    previewDone.innerHTML = '';

    filesDoneDipilih.forEach(file=>{
      const reader = new FileReader();
      reader.onload = e=>{
        const img = document.createElement('img');
        img.src = e.target.result;
        previewDone.appendChild(img);
      };
      reader.readAsDataURL(file);
    });
  });
}

/* ================= FORMAT TANGGAL ================= */

function formatTanggal(value){
  if(!value) return '';
  const date = new Date(value);

  return `${String(date.getDate()).padStart(2,'0')}-` +
         `${String(date.getMonth()+1).padStart(2,'0')}-` +
         `${date.getFullYear()} ` +
         `${String(date.getHours()).padStart(2,'0')}:` +
         `${String(date.getMinutes()).padStart(2,'0')}`;
}

/* ================= ERROR LOGGER ================= */

function safeErrorLog(err, context=''){
  console.log('SUPABASE ERROR:', context, err);
}

/* ================= LOAD DATA TERAKHIR ================= */

async function loadDataTerakhir(){

  const { data:dataUnloading, error:errorUnloading } =
  await supabaseClient
    .from('unloading_data')
    .select('*')
    .order('id',{ ascending:false })
    .limit(1)
    .maybeSingle();

  if(!errorUnloading && dataUnloading){
    DATA_TERAKHIR = dataUnloading;
    DATA_SUDAH_DISIMPAN = true;
    tampilkanPreviewUnloading(DATA_TERAKHIR);
  }

  const { data:dataDone, error:errorDone } =
  await supabaseClient
    .from('done_unloading')
    .select('*')
    .order('id',{ ascending:false })
    .limit(1)
    .maybeSingle();

  if(!errorDone && dataDone){
    DONE_TERAKHIR = dataDone;
    DONE_SUDAH_DISIMPAN = true;
    tampilkanPreviewDone(DONE_TERAKHIR);
  }
}

window.addEventListener('load', loadDataTerakhir);

/* ================= FORMAT NOPOL AUTO ================= */

const nopolInput = document.getElementById('nopol');

nopolInput.addEventListener('input', () => {

  let v = nopolInput.value.toUpperCase().replace(/[^A-Z0-9]/g,'');

  let match = v.match(/^([A-Z]{1,2})(\d{0,4})([A-Z]{0,3})$/);

  if(match){
    let hasil = match[1] || '';
    if(match[2]) hasil += ' ' + match[2];
    if(match[3]) hasil += ' ' + match[3];
    nopolInput.value = hasil.trim();
  } else {
    nopolInput.value = v;
  }

});

/* ================= INPUT AUTO UPDATE ================= */

const semuaInput =
document.querySelectorAll('#from,#to,#phase,#jenis,#driver,#nopol,#seal,#colly,#waktu');

semuaInput.forEach(el=>{
  el.addEventListener('input',()=>{
    if(el.type !== 'datetime-local'){
      el.value = el.value.toUpperCase();
    }
    DATA_SUDAH_DISIMPAN = false;
    updatePreview();
  });
});

doneWaktu.addEventListener('input', updateDonePreview);

/* ================= PREVIEW ================= */

function tampilkanPreviewUnloading(data){
  if(!data) return hasilUnloading.innerText = '';

  hasilUnloading.innerText =
`INBOUND

${data.from_data || ''} 🛻 => ${data.to_data || ''}
PHASE ${data.phase || ''} ${data.jenis || ''}

DRIVER : ${data.driver || ''}
NOPOL : ${data.nopol || ''}
NO SEAL : ${data.seal || ''}
TOTAL COLLY : ${data.colly || ''}
WAKTU UNLOADING : ${formatTanggal(data.waktu || '')}`;
}

function tampilkanPreviewDone(data){
  if(!data) return hasilDone.innerText = '';

  hasilDone.innerText =
`DONE UNLOADING

DRIVER : ${data.driver || ''}
NOPOL : ${data.nopol || ''}
NO SEAL : ${data.seal || ''}
WAKTU DONE : ${formatTanggal(data.waktu_done || '')}`;
}

/* ================= UPDATE PREVIEW ================= */

function updatePreview(){
  tampilkanPreviewUnloading({
    from_data:from.value,
    to_data:to.value,
    phase:phase.value,
    jenis:jenis.value,
    driver:driver.value,
    nopol:nopol.value,
    seal:seal.value,
    colly:colly.value,
    waktu:waktu.value
  });
}

function updateDonePreview(){
  tampilkanPreviewDone({
    driver:DATA_TERAKHIR?.driver || '',
    nopol:DATA_TERAKHIR?.nopol || '',
    seal:DATA_TERAKHIR?.seal || '',
    waktu_done:doneWaktu.value
  });
}

/* ================= SIMPAN UNLOADING ================= */

async function simpanSemuaData(){

  const dataInsert = {
    from_data: from.value,
    to_data: to.value,
    phase: phase.value,
    jenis: jenis.value,
    driver: driver.value,
    nopol: nopol.value,
    seal: seal.value,
    colly: colly.value,
    waktu: waktu.value
  };

  const { data, error } =
  await supabaseClient
    .from('unloading_data')
    .insert([dataInsert])
    .select();

  if(error){
    safeErrorLog(error,'INSERT unloading_data');
    alert('GAGAL SIMPAN');
    return;
  }

  DATA_TERAKHIR = data?.[0] || null;
  DATA_SUDAH_DISIMPAN = true;

  tampilkanPreviewUnloading(DATA_TERAKHIR);
  alert('DATA BERHASIL DISIMPAN');
}

/* ================= SIMPAN DONE (SUDAH SUPPORT FOTO) ================= */

async function simpanDoneData(){

  if(!DATA_SUDAH_DISIMPAN){
    alert('SIMPAN UNLOADING DULU');
    return;
  }

  const dataDone = {
    driver: DATA_TERAKHIR?.driver || '',
    nopol: DATA_TERAKHIR?.nopol || '',
    seal: DATA_TERAKHIR?.seal || '',
    waktu_done: doneWaktu.value
  };

  const { data, error } =
  await supabaseClient
    .from('done_unloading')
    .insert([dataDone])
    .select();

  if(error){
    safeErrorLog(error,'INSERT done_unloading');
    alert('GAGAL SIMPAN DONE');
    return;
  }

  DONE_TERAKHIR = data?.[0] || null;
  DONE_SUDAH_DISIMPAN = true;

  tampilkanPreviewDone(DONE_TERAKHIR);
  alert('DONE BERHASIL DISIMPAN');
}

/* ================= WA UNLOADING ================= */

async function kirimWA(){

  if(!DATA_SUDAH_DISIMPAN) return alert('SIMPAN DULU');

  const text = hasilUnloading.innerText;

  if(filesDipilih.length && navigator.share){
    await navigator.share({ text, files:filesDipilih });
  } else {
    window.open(`https://wa.me/?text=${encodeURIComponent(text)}`);
  }
}

/* ================= WA DONE (SUDAH SUPPORT FOTO) ================= */

async function kirimDoneWA(){

  if(!DONE_SUDAH_DISIMPAN) return alert('SIMPAN DONE DULU');

  const text = hasilDone.innerText;

  if(filesDoneDipilih.length && navigator.share){
    await navigator.share({ text, files:filesDoneDipilih });
  } else {
    window.open(`https://wa.me/?text=${encodeURIComponent(text)}`);
  }
}

/* ================= RESET ================= */

async function resetForm(){

  const ok = confirm("RESET SEMUA DATA?");
  if(!ok) return;

  await supabaseClient.from('unloading_data').delete().neq('id',0);
  await supabaseClient.from('done_unloading').delete().neq('id',0);
  await supabaseClient.from('master_data').delete().neq('id',0);

  DATA_TERAKHIR=null;
  DONE_TERAKHIR=null;
  DATA_SUDAH_DISIMPAN=false;
  DONE_SUDAH_DISIMPAN=false;

  hasilUnloading.innerText='';
  hasilDone.innerText='';

  alert('RESET BERHASIL');
}

</script>

</body>
</html>
